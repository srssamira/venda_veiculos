<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda de Veículos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Venda de Veículos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="search-panel">
            <h2>Encontre seu próximo veículo</h2>
            <form>
                <select name="marca">
                    <option value="">Marca</option>
                    <option value="fiat">Fiat</option>
                    <option value="ford">Ford</option>
                    <option value="gm">Chevrolet</option>
                </select>
                <select name="modelo">
                    <option value="">Modelo</option>
                    <option value="palio">Palio</option>
                    <option value="fiesta">Fiesta</option>
                    <option value="onix">Onix</option>
                </select>
                <select name="localizacao">
                    <option value="">Localização</option>
                    <option value="sp">São Paulo</option>
                    <option value="rj">Rio de Janeiro</option>
                    <option value="mg">Minas Gerais</option>
                </select>
                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="vehicle-listing">
            <h2>Veículos em Destaque</h2>
            <div class="card">
                <img src="img/insira_imagem_do_veiculo.png" alt="Veículo">
                <h3>Fiat Palio</h3>
                <p>Ano: 2020</p>
                <p>Cidade: Uberlândia - MG</p>
                <p>Valor: R$ 45.000,00</p>
                <a href="veiculo.html">Ver detalhes</a>
            </div>
            <div class="card">
                <img src="img/insira_imagem_do_veiculo" alt="Veículo">
                <h3>Ford Fiesta</h3>
                <p>Ano: 2022</p>
                <p>Cidade: Araxá - MG</p>
                <p>Valor: R$ 55.000,00</p>
                <a href="veiculo.html">Ver detalhes</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 venda de veículos</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
