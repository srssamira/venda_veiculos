<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Veículo - Venda de Veículos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Venda de Veículos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="vehicle-detail">
            <img src="img/car-placeholder.png" alt="Veículo">
            <div class="vehicle-info">
                <h2>Fiat Palio</h2>
                <p><strong>Ano:</strong> 2020</p>
                <p><strong>Cidade:</strong> São Paulo</p>
                <p><strong>Valor:</strong> R$ 45.000,00</p>
                <p><strong>Descrição:</strong> Veículo em ótimo estado, único dono, com todas as revisões em dia.</p>

                <form class="interest-form">
                    <h3>Deixe seu contato</h3>
                    <input type="text" name="nome" placeholder="Seu nome" required>
                    <input type="tel" name="telefone" placeholder="Seu telefone" required>
                    <textarea name="mensagem" placeholder="Sua mensagem" required></textarea>
                    <button type="submit">Enviar Mensagem</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Venda de Veículos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
